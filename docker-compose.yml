services:
  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      TZ: America/New_York
      CRON_MIN: "1,31"
    volumes:
      - freshrss-data:/var/www/FreshRSS/data
      - ./xExtension-Captcha:/var/www/FreshRSS/extensions/xExtension-Captcha
      - ./xExtension-ColorfulList:/var/www/FreshRSS/extensions/xExtension-ColorfulList
      - ./xExtension-ImageProxy:/var/www/FreshRSS/extensions/xExtension-ImageProxy
      - ./xExtension-QuickCollapse:/var/www/FreshRSS/extensions/xExtension-QuickCollapse
      - ./xExtension-ReadingTime:/var/www/FreshRSS/extensions/xExtension-ReadingTime
      - ./xExtension-ShareByEmail:/var/www/FreshRSS/extensions/xExtension-ShareByEmail
      - ./xExtension-StickyFeeds:/var/www/FreshRSS/extensions/xExtension-StickyFeeds
      - ./xExtension-TitleWrap:/var/www/FreshRSS/extensions/xExtension-TitleWrap
      - ./xExtension-UnsafeAutologin:/var/www/FreshRSS/extensions/xExtension-UnsafeAutologin
      - ./xExtension-WordHighlighter:/var/www/FreshRSS/extensions/xExtension-WordHighlighter
      - ./xExtension-YouTube:/var/www/FreshRSS/extensions/xExtension-YouTube
      - ./xExtension-showFeedID:/var/www/FreshRSS/extensions/xExtension-showFeedID

volumes:
  freshrss-data:
